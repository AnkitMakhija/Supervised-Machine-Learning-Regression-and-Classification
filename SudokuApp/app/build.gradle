plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sudokuapp' // Changed from com.example.sudoku to avoid conflict with java dir
    compileSdk 33 // Example SDK version

    defaultConfig {
        applicationId "com.example.sudokuapp"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // If using Kotlin, uncomment the following block
    // kotlinOptions {
    //     jvmTarget = '1.8'
    // }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // Example version
    implementation 'com.google.android.material:material:1.8.0' // Example version
    // Add other dependencies here
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
